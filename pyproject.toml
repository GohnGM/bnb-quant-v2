[project]
name = "bnb-quant-v2"
version = "0.1.0"
description = "Clean quant workspace (Gate kline import fixed)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
bnbquant = "bnb_quant_v2.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
